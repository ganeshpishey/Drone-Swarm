environment:
  # The state-transition mechanics remain relay-grid-v1.  Drone metadata is
  # used by the environment snapshot and the isometric replay renderer.
  preset: drone_urban_3d
  drone:
    enabled: true
    cruise_altitude_m: 30.0
    building_height_m: 18.0
    true_3d_mode: true
    flight_levels: 4
    cruise_flight_level: 3
    building_height_levels: 2

# The initial visualisation uses deterministic generated seeds. A dedicated
# frozen drone manifest can be generated before the final experiment runs.
training:
  scenario_manifest: null

evaluation:
  scenario_manifest: null
